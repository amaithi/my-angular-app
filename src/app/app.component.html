<h1>Welcome to My Angular App</h1>
<p>This is the main application view.</p>
<p>Current title: {{ title }}</p>
//user name and password formControlName="control"
<!-- 
This is a login form implemented using Angular's reactive forms approach. 
It includes the following fields:

1. Username:
    - Input field with `formControlName="username"`.
    - Validation: Required.
    - Displays an error message if the field is touched and left empty.

2. Password:
    - Input field with `formControlName="password"`.
    - Validation: Required.
    - Displays an error message if the field is touched and left empty.

3. Email:
    - Input field with `formControlName="email"`.
    - Validation: Required and must be a valid email format.
    - Displays error messages for:
      - Missing input (required).
      - Invalid email format.

The form uses the `[formGroup]` directive to bind to the `loginForm` object in the component class.
The `(ngSubmit)` event is used to trigger the `onSubmit()` method when the form is submitted.
The submit button is disabled if the form is invalid.
-->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="username">Username:</label>
    <input id="username" formControlName="username" required>
    <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')" class="error">
        Username is required.
    </div>
    
    <label for="password">Password:</label>
    <input id="password" type="password" formControlName="password" required>
    <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="error">
        Password is required.
    </div>
    //add email field
    <label for="email">Email:</label>
    <input id="email" type="email" formControlName="email" required>
    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="error">
        Email is required.
    </div>
    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" class="error">
        Please enter a valid email address.
    </div>
    <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="error">
        Email is required.
    </div>
    
    <button type="submit" [disabled]="loginForm.invalid">Login</button>
</form>
